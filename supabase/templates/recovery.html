<h2>Reset your password</h2>
<p>We received a request to reset your password. Follow the link below to choose a new one.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/account/reset-password/new">Reset password</a></p>
<p>This link can be used once. If you did not request this change, you can ignore this email.</p>
