name: Publish Core release to registry
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to retry
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: core-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected a semantic version tag')
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + urllib.parse.quote(tag, safe='')]))
          if release['draft'] or not release['published_at']:
              raise SystemExit('Release must be published')
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_COMMIT=' + commit + '\n')
          PY
      - name: Attach immutable release ZIP if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-release"
          if gh release download "$RELEASE_TAG" --pattern supacharger.zip --dir "$RUNNER_TEMP/core-release"; then
            echo 'Reusing the existing release ZIP.'
          else
            git archive --format=zip --prefix=supacharger/ --output="$RUNNER_TEMP/core-release/supacharger.zip" "$RELEASE_COMMIT"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/core-release/supacharger.zip"
          fi
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.environ['RUNNER_TEMP'] + '/core-release/supacharger.zip') as archive:
              if archive.testzip() is not None or archive.comment.decode('ascii') != os.environ['RELEASE_COMMIT']:
                  raise SystemExit('Release ZIP verification failed')
          PY
      - name: Notify registry
        env:
          GH_TOKEN: ${{ secrets.SC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY' | gh api --method POST repos/glowplug-studio/supacharger-cli-extension-register/dispatches --input -
          import json, os
          print(json.dumps({'event_type': 'supacharger-release', 'client_payload': {'tag': os.environ['RELEASE_TAG']}}))
          PY
